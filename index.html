</style><main><h1>魔術方塊助手 v3.0</h1><p class="muted">3×3｜自動定位・透視校正・多影格取色・逐步圖解</p><section><h2>1　掃描六面</h2><div id="tabs" class="row"></div><p id="orientation"></p><div class="camera"><video id="video" playsinline autoplay muted></video><img id="still" class="hidden" alt="待辨識照片"><svg id="overlay" viewBox="0 0 320 320" aria-label="辨識框線"></svg><div class="guide" id="guide"></div></div><div class="row"><button class="primary" id="start">開啟相機</button><button id="capture" disabled>儲存穩定取色</button><button id="stop">關閉相機</button></div><div class="row"><button id="mode" aria-pressed="false">手動四角定位</button><button id="clearPhoto" class="hidden">關閉照片</button><label><input id="autoSave" type="checkbox">自動儲存並前往下一面</label></div><div id="cameraStatus" class="camera-status" role="status">開啟相機或選取照片，程式將自動找出九個色塊。</div><div class="scan-meter"><div id="meter" style="width:0%"></div></div><div id="scanQuality" class="quality"></div><label class="muted">或拍照／選取照片（完整拍入一面）<input type="file" id="photo" accept="image/*" capture="environment"></label><div id="preview"></div><div id="rawPreview" style="max-width:160px;margin:8px auto"></div><button id="nextFace">下一面</button><p class="muted">先選定一個正面 F 與上面 U，後續依提示轉動整顆方塊，勿轉動單層。不需對準固定框線；請讓目前面完整入鏡、方向保持正立，避免遮擋與強反光。偵測失敗時可手動拖曳四角。</p></section><section><h2>2　確認及校正顏色</h2><p class="muted">不預設任何實體顏色。先拍攝六面，建立六個實測中心色，再統一辨識。黃框表示色差接近或辨識疑慮；點選下方實測色，再點色塊可修正。</p><div id="calibration" class="muted"></div><div class="palette" id="palette"></div><p class="muted" id="confidence"></p><p id="counts" class="muted"></p><div class="net" id="net"></div><div class="row"><button id="classify">重新辨識（保留手動修正）</button><button id="balance">依每色九格建議校正</button><button id="demo">載入示範</button><button id="reset">清除</button></div><p id="status" class="status" role="status"></p><button class="primary" id="solve">產生還原解法</button></section><section id="solution" class="hidden"><h2>3　逐步還原</h2><p class="muted">回到最初的 F 正面、U 上面。全程保持握法不變；順逆時針以直接面對要轉動的那一面為準。</p><div id="progress"></div><div class="big" const Vision=(()=>{

function save(advance=false){if(!latest)return;let data=latest;if(demoMode){let f=face;reset();face=f;}let f=face;raw[f]=data.rgb;colors[f]=hex(data.rgb[4]);scanMeta[f]={frames:data.frames,manual:data.manual,photo:data.photo};for(let j=0;j<9;j++){edits.delete(f*9+j);scanIssues.delete(f*9+j);if(data.spatial[j]>23||data.temporal[j]>12)scanIssues.set(f*9+j,true)}balanced=false;msg('');classify();if(!$('status').textContent.includes('中心色過於相近'))msg(ready()?'六面中心色已建立，請核對黃框及各色數量。':`已儲存 ${names[f]} 面（${data.frames} 張影格）；尚未分類。`);if(advance&&!ready()){let next=order.slice(order.indexOf(f)+1).concat(order).find(k=>!raw[k]);if(next!==undefined){face=next;resetTracking();render();}}else{autoBlocked=true;cameraStatus('已儲存此面。可選下一面，或重新擷取此面。','ok');}}
$('capture').onclick=()=>save(!photoData&&$('autoSave').checked);$('mode').onclick=()=>{manual=!manual;if(manual&&lastQ)manualQ=lastQ.map(p=>({...p}));$('mode').textContent=manual?'返回自動定位':'手動四角定位';$('mode').setAttribute('aria-pressed',String(manual));resetTracking();if(!photoData)drawOverlay(manual?manualQ:null);if(manual&&!photoData)cameraStatus('拖曳四個黃色角點至色塊外緣；完成後保持穩定。');};
$('overlay').addEventListener('pointerdown',e=>{if(!manual||e.target.dataset.corner===undefined)return;drag=+e.target.dataset.corner;$('overlay').setPointerCapture(e.pointerId);e.preventDefault()});$('overlay').addEventListener('pointermove',e=>{if(drag<0)return;let r=$('overlay').getBoundingClientRect();manualQ[drag]={x:Math.max(2,Math.min(N-2,(e.clientX-r.left)/r.width*N)),y:Math.max(2,Math.min(N-2,(e.clientY-r.top)/r.height*N))};resetTracking();drawOverlay(manualQ);});for(let event of ['pointerup','pointercancel','lostpointercapture'])$('overlay').addEventListener(event,()=>{drag=-1;});
$('clearPhoto').onclick=()=>{closePhoto();drawOverlay(manual?manualQ:null);cameraStatus('可重新開啟相機或選取照片。')};$('photo').onchange=()=>{let file=$('photo').files[0];if(!file)return;stop();closePhoto();let token=++scanToken,url=URL.createObjectURL(file),im=new Image();photoURL=url;im.onload=()=>{if(token!==scanToken){URL.revokeObjectURL(url);return}photoImage=im;photoData=frame(im,im.naturalWidth,im.naturalHeight);$('still').src=url;$('still').classList.remove('hidden');$('clearPhoto').classList.remove('hidden');resetTracking();$('photo').value=''};im.onerror=()=>{closePhoto();cameraStatus('無法讀取照片。','warn')};im.src=url;};
function lab(rgb){let [r,g,b]=rgb.map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});let t=[(.4124564*r+.3575761*g+.1804375*b)/.95047,.2126729*r+.7151522*g+.072175*b,(.0193339*r+.119192*g+.9503041*b)/1.08883].map(v=>v>.008856?Math.cbrt(v):7.787*v+16/116);return [116*t[1]-16,500*(t[0]-t[1]),200*(t[1]-t[2])]}
// Weighted Lab: reduce sensitivity to exposure shifts while retaining lightness for pale colors.
function dist(p,q){return .40*(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2}
// Minimum-cost one-to-one assignment; each color has eight non-center slots.
function assign(cost){let n=cost.length;if(!n)return [];let u=Array(n+1).fill(0),v=u.slice(),p=u.slice(),way=u.slice();for(let i=1;i<=n;i++){p[0]=i;let j0=0,min=Array(n+1).fill(Infinity),used=Array(n+1).fill(false);do{used[j0]=true;let i0=p[j0],delta=Infinity,j1=0;for(let j=1;j<=n;j++)if(!used[j]){let cur=cost[i0-1][j-1]-u[i0]-v[j];if(cur<min[j]){min[j]=cur;way[j]=j0}if(min[j]<delta){delta=min[j];j1=j}}for(let j=0;j<=n;j++)if(used[j]){u[p[j]]+=delta;v[j]-=delta}else min[j]-=delta;j0=j1}while(p[j0]);do{let j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}let out=Array(n);for(let j=1;j<=n;j++)out[p[j]-1]=j-1;return out}
function classify(useBalance=false){$('solution').classList.add('hidden');uncertain.clear();balanced=useBalance;if(!ready()){cells=Array(54).fill('?');render();return}let centers=raw.map(a=>lab(a[4])), rows=[], slots=[];let close=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)if(Math.sqrt(dist(centers[i],centers[j]))<12)close.push(F[i]+'/'+F[j]);for(let f=0;f<6;f++)for(let j=0;j<9;j++){let i=f*9+j;if(j===4){cells[i]=F[f];continue}if(edits.has(i)){cells[i]=edits.get(i);continue}let p=lab(raw[f][j]),ds=centers.map(q=>dist(p,q)),rank=ds.map((_,k)=>k).sort((a,b)=>ds[a]-ds[b]);cells[i]=F[rank[0]];if(scanIssues.has(i)||Math.sqrt(ds[rank[0]])>23||Math.sqrt(ds[rank[1]])-Math.sqrt(ds[rank[0]])<8)uncertain.add(i);rows.push({i,ds,best:rank[0]})}if(useBalance){for(let f=0;f<6;f++){let remain=8-[...edits.values()].filter(v=>v===F[f]).length;if(remain<0){balanced=false;render();msg('手動指定的 '+F[f]+' 色已超過九格，請先修正。');return}for(let j=0;j<remain;j++)slots.push(f)}let result=assign(rows.map(r=>slots.map(f=>r.ds[f]))), affected=new Set();rows.forEach((r,k)=>{let f=slots[result[k]];cells[r.i]=F[f];if(f!==r.best){uncertain.add(r.i);affected.add(r.best);affected.add(f)}});rows.forEach(r=>{if(affected.has(r.best))uncertain.add(r.i)})}render();if(close.length)msg('中心色過於相近：'+close.join('、')+'。請檢查是否重複掃描同一面、光線或反光。')}
$('classify').onclick=()=>{msg('');classify(false);if(!$('status').textContent.includes('中心色過於相近'))msg('已用六個實測中心色重新辨識。')};$('balance').onclick=()=>{msg('');classify(true);if(balanced&&!$('status').textContent.includes('中心色過於相近'))msg('已產生每色九格的建議；黃框可能是誤判，請逐一核對實物。')};$('nextFace').onclick=()=>{if(photoData)closePhoto();face=order[(order.indexOf(face)+1)%6];resetTracking();render()};function reset(){raw=Array(6).fill(null);cells=Array(54).fill('?');colors=Array(6).fill(null);face=2;edits.clear();uncertain.clear();balanced=false;demoMode=false;scanIssues.clear();scanMeta=Array(6).fill(null);resetTracking();$('solution').classList.add('hidden');msg('');render()}$('reset').onclick=reset;$('demo').onclick=()=>{if(!window.Cube)return msg('解法函式庫尚未載入');reset();demoMode=true;colors=standard.slice();let c=new Cube();c.move("R U F2 L D' B R2");cells=c.asString().split('');render()};
function validate(s){if([...F].some(f=>s.split(f).length!==10)||s.length!==54)throw Error('每種顏色必須剛好九格，請檢查未填或錯色。');let c=Cube.fromString(s);if(c.asString()!==s||new Set(c.cp).size!==8||new Set(c.ep).size!==12||c.co.reduce((a,b)=>a+b,0)%3||c.eo.reduce((a,b)=>a+b,0)%2||c.cornerParity()!==c.edgeParity())throw Error('這不是可還原的方塊狀態。請檢查六面方向與顏色，或是否曾拆裝方塊。');return c}
$('solve').onclick=()=>{try{if(!window.Cube||!Cube.prototype.solve)throw Error('無法載入解法函式庫，請確認網路連線後重新整理。');let s=cells.join('');validate(s);stop();$('solve').disabled=true;msg('正在計算還原步驟…');if(!worker){worker=new Worker('solver.js');worker.onerror=()=>{msg('解法引擎載入失敗，請確認網路與部署檔案。');$('solve').disabled=false;worker.terminate();worker=null}}worker.onmessage=e=>{let d=e.data;if(d.error){msg(d.error);$('solve').disabled=false;return}try{let c=validate(s);moves=d.result.trim().split(/\s+/).filter(Boolean);states=[s];moves.forEach(m=>{c.move(m);states.push(c.asString())});if(!c.isSolved())throw Error('解法驗證失敗');step=0;$('solution').classList.remove('hidden');show();msg('已完成解法驗證，共 '+moves.length+' 步。');$('solution').scrollIntoView({behavior:'smooth'})}catch(e){msg(e.message)}finally{$('solve').disabled=false}};worker.postMessage(s)}catch(e){msg(e.message)}};
function show(){let m=moves[step],done=step===moves.length;$('progress').textContent=done?'已完成':`步驟 ${step+1} / ${moves.length}`;$('move').textContent=done?'完成還原！':m;let f=done?2:F.indexOf(m[0]),half=m?.endsWith('2'),rev=m?.endsWith("'");$('instruction').textContent=done?'六面應各為單一顏色。':`找到${names[f]}面 ${F[f]}（中心色見下圖），直接面對該面，${half?'旋轉 180°':rev?'逆時針旋轉 90°':'順時針旋轉 90°'}，只轉這一層。`;let before=states[step];let tiles=Array.from({length:9},(_,j)=>`<rect x="${60+j%3*40}" y="${60+Math.floor(j/3)*40}" width="37" height="37" rx="4" fill="${colors[F.indexOf(before[f*9+j])]}" stroke="#26323b"/>`).join('');let arc=half?'M 120 25 A 95 95 0 0 1 120 215':rev?'M 120 25 A 95 95 0 0 0 25 120':'M 120 25 A 95 95 0 0 1 215 120';$('diagram').innerHTML=done?'':`<svg viewBox="0 0 240 240" aria-label="直接面對轉動面之旋轉方向"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#245d77"/></marker></defs>${tiles}<path d="${arc}" fill="none" stroke="#245d77" stroke-width="5" marker-end="url(#arrow)"/><text x="120" y="225" text-anchor="middle" fill="#245d77">${half?'180°':rev?'逆時針 90°':'順時針 90°'}</text></svg>`;$('afterLabel').textContent=done?'最終狀態':'完成本步後的六面預期狀態（展開圖）';net($('after'),states[Math.min(step+1,moves.length)]);$('prev').disabled=step===0;$('next').disabled=done;$('steps').innerHTML=moves.map((m,i)=>`<button data-step="${i}" class="${i===step?'selected':''}">${i+1}. ${m}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{step=+b.dataset.step;show()})} $('prev').onclick=()=>{if(step>0){step--;show()}};$('next').onclick=()=>{if(step<moves.length){step++;show()}};render();
