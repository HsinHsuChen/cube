<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>魔術方塊助手</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#203040;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{font-size:26px;margin:0}h2{font-size:19px}section{background:white;border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 2px 12px #2030400b}p{line-height:1.55}button{font:inherit;border:0;border-radius:10px;padding:12px;background:#e8edf2;color:#203040;cursor:pointer;margin:3px}button.primary{background:#245d77;color:white}button:disabled{opacity:.45}button.selected{outline:3px solid #245d77}.camera{position:relative;aspect-ratio:1;max-width:340px;margin:auto;background:#18232d;border-radius:12px;overflow:hidden}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;inset:17%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;pointer-events:none}.guide i{border:2px solid #fff9;border-radius:5px;display:grid;place-items:center}.guide i:after{content:'+';color:white;text-shadow:0 0 3px black}.face{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#29313a;padding:4px;border-radius:6px;aspect-ratio:1}.tile{border-radius:4px;min-width:0;display:grid;place-items:center;color:#222;font-size:11px;font-weight:bold;position:relative}.tile button{position:absolute;inset:0;background:transparent;margin:0;padding:0}.net{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:440px;margin:auto}.facewrap{text-align:center;font-size:12px}.palette{display:flex;flex-wrap:wrap;gap:5px}.palette button{width:40px;height:40px;border:1px solid #aaa}.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.muted{color:#647485;font-size:14px}.status{white-space:pre-wrap;color:#9a4228}.big{font-size:30px;font-weight:bold}svg{width:100%;max-width:300px;display:block;margin:auto}#preview{max-width:160px;margin:10px auto}.steps{display:flex;flex-wrap:wrap}.steps button{font-size:13px;padding:7px}input{max-width:100%} .hidden{display:none}
</style><main><h1>魔術方塊助手 v2.0</h1><p class="muted">3×3｜相機取色・手動校正・逐步圖解</p><section><h2>1　掃描六面</h2><div id="tabs" class="row"></div><p id="orientation"></p><div class="camera"><video id="video" playsinline autoplay muted></video><div class="guide" id="guide"></div></div><div class="row"><button class="primary" id="start">開啟相機</button><button id="capture">擷取九格</button><button id="stop">關閉相機</button></div><label class="muted">或拍照／選取照片（方塊須置中並占畫面約 66%）<input type="file" id="photo" accept="image/*" capture="environment"></label><div id="preview"></div><div id="rawPreview" style="max-width:160px;margin:8px auto"></div><button id="nextFace">下一面</button><p class="muted">先選定一個正面 F 與上面 U，後續依提示轉動整顆方塊，勿轉動單層。每面九格需對準框線，避免反光。</p></section><section><h2>2　確認及校正顏色</h2><p class="muted">不預設任何實體顏色。先拍攝六面，建立六個實測中心色，再統一辨識。黃框表示色差接近或辨識疑慮；點選下方實測色，再點色塊可修正。</p><div id="calibration" class="muted"></div><div class="palette" id="palette"></div><p class="muted" id="confidence"></p><p id="counts" class="muted"></p><div class="net" id="net"></div><div class="row"><button id="classify">重新辨識（保留手動修正）</button><button id="balance">依每色九格建議校正</button><button id="demo">載入示範</button><button id="reset">清除</button></div><p id="status" class="status" role="status"></p><button class="primary" id="solve">產生還原解法</button></section><section id="solution" class="hidden"><h2>3　逐步還原</h2><p class="muted">回到最初的 F 正面、U 上面。全程保持握法不變；順逆時針以直接面對要轉動的那一面為準。</p><div id="progress"></div><div class="big" id="move"></div><p id="instruction"></p><div id="diagram"></div><p class="muted" id="afterLabel"></p><div id="after" class="net"></div><div class="row"><button id="prev">上一步</button><button class="primary" id="next">完成此步／下一步</button></div><div class="steps" id="steps"></div></section></main><script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.js"></script><script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.js"></script><script>
const $=id=>document.getElementById(id), F='URFDLB', names=['上','右','前','下','左','後'], standard=['#ffffff','#e33d32','#28a45b','#f4d536','#f58b28','#347bd5'];let raw=Array(6).fill(null), cells=Array(54).fill('?'), colors=Array(6).fill(null), face=2, selected=0, stream, moves=[], states=[], step=0, worker; const order=[2,1,5,4,0,3];let edits=new Map(), uncertain=new Set(), balanced=false, demoMode=false; const hex=rgb=>"#"+rgb.map(v=>v.toString(16).padStart(2,"0")).join(""); const ready=()=>raw.every(Boolean);const hints=['上面 U：從原始握法將頂面朝向相機，原本後面 B 朝上。','右面 R：原本上面 U 保持朝上，右面朝相機。','正面 F：先選一面朝相機，記住頂面 U 與正面 F 的中心色。','下面 D：從原始握法將底面朝向相機，原本正面 F 朝上。','左面 L：原本上面 U 保持朝上，左面朝相機。','後面 B：原本上面 U 保持朝上，後面朝相機。'];
function faceHTML(s,f,edit=false){return `<div class="facewrap"><div>${names[f]} ${F[f]}</div><div class="face">${Array.from({length:9},(_,j)=>{let i=f*9+j,k=F.indexOf(s[i]);return `<div class="tile" style="background:${(k>=0?colors[k]:null)||(!demoMode&&raw[f]?hex(raw[f][j]):'#b9c1ca')};${edit&&uncertain.has(i)?'box-shadow:inset 0 0 0 3px #ffb700;':''}">${j===4?F[f]:''}${edit&&j!==4?`<button aria-label="${F[f]} 第 ${j+1} 格" data-cell="${i}"></button>`:''}</div>`}).join('')}</div></div>`}
function net(el,s,edit=false){el.innerHTML=[0,4,2,1,5,3].map((f,i)=>`<div style="grid-column:${[2,1,2,3,4,2][i]};grid-row:${[1,2,2,2,2,3][i]}">${faceHTML(s,f,edit)}</div>`).join('');if(edit)el.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{editCell(+b.dataset.cell)})}
function editCell(i){$('solution').classList.add('hidden');if(!ready()&&!demoMode)return msg("請先掃描六面，建立完整色票。");cells[i]=F[selected];edits.set(i,F[selected]);uncertain.delete(i);render()}
function render(){for(let f=0;f<6;f++)cells[f*9+4]=F[f];$('tabs').innerHTML=order.map(f=>`<button data-f="${f}" class="${f===face?'selected':''}">${names[f]} ${F[f]}${raw[f]?' ✓':''}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{face=+b.dataset.f;render()});$('orientation').textContent=hints[face];$('preview').innerHTML=faceHTML(cells,face,true);$('rawPreview').innerHTML=ready()&&raw[face]?`<div class="facewrap">原始取色（${names[face]}）</div><div class="face">${raw[face].map(rgb=>`<div class="tile" style="background:${hex(rgb)}"></div>`).join('')}</div>`:'';$('preview').querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{editCell(+b.dataset.cell)});$('calibration').textContent=demoMode?'示範模式（非實測）':`實測中心色：${raw.filter(Boolean).length}/6。${ready()?'已建立完整色票。':'尚不分類，預覽僅顯示實際取色。'}`;$('palette').innerHTML=colors.map((c,i)=>`<button ${!c?'disabled':''} style="background:${c||'#d4d9df'};color:${c&&lab(c.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16)))[0]<48?'white':'#20252a'}" class="${i===selected?'selected':''}" data-p="${i}">${F[i]}</button>`).join('');$('classify').disabled=!ready();$('balance').disabled=!ready();$('solve').disabled=(!ready()&&!demoMode);$('confidence').textContent=ready()?`需確認色塊：${uncertain.size} 格。${balanced?'已套用九格數量限制，仍須核對實物。':''}`:'';$('palette').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.p;render()});net($('net'),cells,true);$('counts').textContent=(!ready()&&!demoMode)?'掃描完成前不計算色塊數量。':F.split('').map(f=>f+': '+cells.filter(c=>c===f).length+'/9').join('　');}
$('guide').innerHTML='<i></i>'.repeat(9);function msg(s){$('status').textContent=s}function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null} $('start').onclick=async()=>{try{stop();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play()}catch(e){msg('無法啟動相機：請使用 HTTPS 並允許相機權限，或改用照片。')}};$('stop').onclick=stop;window.addEventListener('pagehide',stop);
function sample(img,w,h){let c=document.createElement('canvas');c.width=c.height=360;let ctx=c.getContext('2d',{willReadFrequently:true}),d=Math.min(w,h);ctx.drawImage(img,(w-d)/2,(h-d)/2,d,d,0,0,360,360);let out=[];for(let y=0;y<3;y++)for(let x=0;x<3;x++){let cx=360*(.17+.66*(x+.5)/3),cy=360*(.17+.66*(y+.5)/3),a=ctx.getImageData(cx-10,cy-10,20,20).data;let rgb=[0,1,2].map(k=>{let v=[];for(let i=k;i<a.length;i+=4)v.push(a[i]);v.sort((a,b)=>a-b);return v[v.length>>1]});out.push(rgb)}if(demoMode){let f=face;reset();face=f;}raw[face]=out;colors[face]=hex(out[4]);for(let j=0;j<9;j++)edits.delete(face*9+j);balanced=false;msg('');classify();if(!$('status').textContent.includes('中心色過於相近'))msg(ready()?'六面中心色已建立，請檢查黃框與各色數量。':'已擷取 '+names[face]+' 面。尚不進行顏色分類。')}
$('capture').onclick=()=>{let v=$('video');if(!v.videoWidth)return msg('請先開啟相機');sample(v,v.videoWidth,v.videoHeight)};$('photo').onchange=()=>{let file=$('photo').files[0];if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{sample(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(url);$('photo').value=''};im.onerror=()=>{URL.revokeObjectURL(url);msg('無法讀取照片')};im.src=url};
function lab(rgb){let [r,g,b]=rgb.map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});let t=[(.4124564*r+.3575761*g+.1804375*b)/.95047,.2126729*r+.7151522*g+.072175*b,(.0193339*r+.119192*g+.9503041*b)/1.08883].map(v=>v>.008856?Math.cbrt(v):7.787*v+16/116);return [116*t[1]-16,500*(t[0]-t[1]),200*(t[1]-t[2])]}
// Weighted Lab: reduce sensitivity to exposure shifts while retaining lightness for pale colors.
function dist(p,q){return .40*(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2}
// Minimum-cost one-to-one assignment; each color has eight non-center slots.
function assign(cost){let n=cost.length;if(!n)return [];let u=Array(n+1).fill(0),v=u.slice(),p=u.slice(),way=u.slice();for(let i=1;i<=n;i++){p[0]=i;let j0=0,min=Array(n+1).fill(Infinity),used=Array(n+1).fill(false);do{used[j0]=true;let i0=p[j0],delta=Infinity,j1=0;for(let j=1;j<=n;j++)if(!used[j]){let cur=cost[i0-1][j-1]-u[i0]-v[j];if(cur<min[j]){min[j]=cur;way[j]=j0}if(min[j]<delta){delta=min[j];j1=j}}for(let j=0;j<=n;j++)if(used[j]){u[p[j]]+=delta;v[j]-=delta}else min[j]-=delta;j0=j1}while(p[j0]);do{let j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}let out=Array(n);for(let j=1;j<=n;j++)out[p[j]-1]=j-1;return out}
function classify(useBalance=false){$('solution').classList.add('hidden');uncertain.clear();balanced=useBalance;if(!ready()){cells=Array(54).fill('?');render();return}let centers=raw.map(a=>lab(a[4])), rows=[], slots=[];let close=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)if(Math.sqrt(dist(centers[i],centers[j]))<12)close.push(F[i]+'/'+F[j]);for(let f=0;f<6;f++)for(let j=0;j<9;j++){let i=f*9+j;if(j===4){cells[i]=F[f];continue}if(edits.has(i)){cells[i]=edits.get(i);continue}let p=lab(raw[f][j]),ds=centers.map(q=>dist(p,q)),rank=ds.map((_,k)=>k).sort((a,b)=>ds[a]-ds[b]);cells[i]=F[rank[0]];if(Math.sqrt(ds[rank[0]])>23||Math.sqrt(ds[rank[1]])-Math.sqrt(ds[rank[0]])<8)uncertain.add(i);rows.push({i,ds,best:rank[0]})}if(useBalance){for(let f=0;f<6;f++){let remain=8-[...edits.values()].filter(v=>v===F[f]).length;if(remain<0){balanced=false;render();msg('手動指定的 '+F[f]+' 色已超過九格，請先修正。');return}for(let j=0;j<remain;j++)slots.push(f)}let result=assign(rows.map(r=>slots.map(f=>r.ds[f]))), affected=new Set();rows.forEach((r,k)=>{let f=slots[result[k]];cells[r.i]=F[f];if(f!==r.best){uncertain.add(r.i);affected.add(r.best);affected.add(f)}});rows.forEach(r=>{if(affected.has(r.best))uncertain.add(r.i)})}render();if(close.length)msg('中心色過於相近：'+close.join('、')+'。請檢查是否重複掃描同一面、光線或反光。')}
$('classify').onclick=()=>{msg('');classify(false);if(!$('status').textContent.includes('中心色過於相近'))msg('已用六個實測中心色重新辨識。')};$('balance').onclick=()=>{msg('');classify(true);if(balanced&&!$('status').textContent.includes('中心色過於相近'))msg('已產生每色九格的建議；黃框可能是誤判，請逐一核對實物。')};$('nextFace').onclick=()=>{face=order[(order.indexOf(face)+1)%6];render()};function reset(){raw=Array(6).fill(null);cells=Array(54).fill('?');colors=Array(6).fill(null);face=2;edits.clear();uncertain.clear();balanced=false;demoMode=false;$('solution').classList.add('hidden');msg('');render()}$('reset').onclick=reset;$('demo').onclick=()=>{if(!window.Cube)return msg('解法函式庫尚未載入');reset();demoMode=true;colors=standard.slice();let c=new Cube();c.move("R U F2 L D' B R2");cells=c.asString().split('');render()};
function validate(s){if([...F].some(f=>s.split(f).length!==10)||s.length!==54)throw Error('每種顏色必須剛好九格，請檢查未填或錯色。');let c=Cube.fromString(s);if(c.asString()!==s||new Set(c.cp).size!==8||new Set(c.ep).size!==12||c.co.reduce((a,b)=>a+b,0)%3||c.eo.reduce((a,b)=>a+b,0)%2||c.cornerParity()!==c.edgeParity())throw Error('這不是可還原的方塊狀態。請檢查六面方向與顏色，或是否曾拆裝方塊。');return c}
$('solve').onclick=()=>{try{if(!window.Cube||!Cube.prototype.solve)throw Error('無法載入解法函式庫，請確認網路連線後重新整理。');let s=cells.join('');validate(s);stop();$('solve').disabled=true;msg('正在計算還原步驟…');if(!worker){worker=new Worker('solver.js');worker.onerror=()=>{msg('解法引擎載入失敗，請確認網路與部署檔案。');$('solve').disabled=false;worker.terminate();worker=null}}worker.onmessage=e=>{let d=e.data;if(d.error){msg(d.error);$('solve').disabled=false;return}try{let c=validate(s);moves=d.result.trim().split(/\s+/).filter(Boolean);states=[s];moves.forEach(m=>{c.move(m);states.push(c.asString())});if(!c.isSolved())throw Error('解法驗證失敗');step=0;$('solution').classList.remove('hidden');show();msg('已完成解法驗證，共 '+moves.length+' 步。');$('solution').scrollIntoView({behavior:'smooth'})}catch(e){msg(e.message)}finally{$('solve').disabled=false}};worker.postMessage(s)}catch(e){msg(e.message)}};
function show(){let m=moves[step],done=step===moves.length;$('progress').textContent=done?'已完成':`步驟 ${step+1} / ${moves.length}`;$('move').textContent=done?'完成還原！':m;let f=done?2:F.indexOf(m[0]),half=m?.endsWith('2'),rev=m?.endsWith("'");$('instruction').textContent=done?'六面應各為單一顏色。':`找到${names[f]}面 ${F[f]}（中心色見下圖），直接面對該面，${half?'旋轉 180°':rev?'逆時針旋轉 90°':'順時針旋轉 90°'}，只轉這一層。`;let before=states[step];let tiles=Array.from({length:9},(_,j)=>`<rect x="${60+j%3*40}" y="${60+Math.floor(j/3)*40}" width="37" height="37" rx="4" fill="${colors[F.indexOf(before[f*9+j])]}" stroke="#26323b"/>`).join('');let arc=half?'M 120 25 A 95 95 0 0 1 120 215':rev?'M 120 25 A 95 95 0 0 0 25 120':'M 120 25 A 95 95 0 0 1 215 120';$('diagram').innerHTML=done?'':`<svg viewBox="0 0 240 240" aria-label="直接面對轉動面之旋轉方向"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#245d77"/></marker></defs>${tiles}<path d="${arc}" fill="none" stroke="#245d77" stroke-width="5" marker-end="url(#arrow)"/><text x="120" y="225" text-anchor="middle" fill="#245d77">${half?'180°':rev?'逆時針 90°':'順時針 90°'}</text></svg>`;$('afterLabel').textContent=done?'最終狀態':'完成本步後的六面預期狀態（展開圖）';net($('after'),states[Math.min(step+1,moves.length)]);$('prev').disabled=step===0;$('next').disabled=done;$('steps').innerHTML=moves.map((m,i)=>`<button data-step="${i}" class="${i===step?'selected':''}">${i+1}. ${m}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{step=+b.dataset.step;show()})} $('prev').onclick=()=>{if(step>0){step--;show()}};$('next').onclick=()=>{if(step<moves.length){step++;show()}};render();
</script></html>
